<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Overlay Clustering Lab</title>
<meta name="description" content="Interactive analysis of the ML-overlay-problem repo: why unsupervised methods struggle to separate overlapping red and green points, with every method running live in the browser on the real dataset.">
<style>
:root{
  --bg:#f7f8fa; --surface:#ffffff; --surface-2:#f0f2f5; --border:#dde1e7;
  --text:#14181f; --muted:#5b6472; --faint:#8a93a1;
  --accent:#2f6fdf; --accent-soft:#2f6fdf1a;
  --red:#d6363c; --green:#2f9a5c; --tp:#d6363c; --fn:#2f6fdf; --fp:#e59400; --tn:#b9c1cc;
  --base:#7a8494; --good:#1f8a52; --warn:#b26a00; --err:#d99a00;
  --shadow:0 1px 2px #0000000d,0 4px 16px #0000000a;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0c0f14; --surface:#141922; --surface-2:#1b212c; --border:#2a3240;
    --text:#e6eaf0; --muted:#9aa4b2; --faint:#6b7585;
    --accent:#6ea2ff; --accent-soft:#6ea2ff1f;
    --red:#ff5a5f; --green:#46c27e; --tp:#ff5a5f; --fn:#6ea2ff; --fp:#ffb020; --tn:#3a4352;
    --base:#8a94a4; --good:#4fd18b; --warn:#ffb020; --err:#ffd23f;
    --shadow:0 1px 2px #0006,0 4px 20px #0004;
  }
}
:root[data-theme="dark"]{
  --bg:#0c0f14; --surface:#141922; --surface-2:#1b212c; --border:#2a3240;
  --text:#e6eaf0; --muted:#9aa4b2; --faint:#6b7585;
  --accent:#6ea2ff; --accent-soft:#6ea2ff1f;
  --red:#ff5a5f; --green:#46c27e; --tp:#ff5a5f; --fn:#6ea2ff; --fp:#ffb020; --tn:#3a4352;
  --base:#8a94a4; --good:#4fd18b; --warn:#ffb020; --err:#ffd23f;
  --shadow:0 1px 2px #0006,0 4px 20px #0004;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font:15px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
code,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.88em}
a{color:var(--accent)}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
nav.top{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--border)}
nav.top .wrap{display:flex;align-items:center;gap:20px;height:52px;overflow-x:auto;white-space:nowrap}
nav.top .brand{font-weight:650;letter-spacing:-.01em}
nav.top a.l{color:var(--muted);text-decoration:none;font-size:13.5px}
nav.top a.l:hover{color:var(--text)}
nav.top .sp{flex:1}
.themebtn{border:1px solid var(--border);background:var(--surface);color:var(--muted);border-radius:8px;padding:4px 10px;font-size:12.5px;cursor:pointer}
header.hero{padding:56px 0 28px}
.eyebrow{font-size:12.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
h1{font-size:clamp(28px,4.4vw,44px);line-height:1.12;letter-spacing:-.025em;margin:10px 0 14px;max-width:20ch}
.lede{font-size:17px;color:var(--muted);max-width:68ch}
section{padding:40px 0;border-top:1px solid var(--border)}
h2{font-size:24px;letter-spacing:-.015em;margin-bottom:6px}
h3{font-size:15px;margin-bottom:8px}
.sub{color:var(--muted);max-width:72ch;margin-bottom:22px}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:1fr 1fr}
@media(max-width:900px){.g4{grid-template-columns:1fr 1fr}.g3,.g2{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px;box-shadow:var(--shadow)}
.tile .v{font-size:30px;font-weight:650;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.tile .k{font-size:13px;color:var(--muted)}
.tile .n{font-size:12.5px;color:var(--faint);margin-top:4px}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;border-bottom:1px solid var(--border);text-align:right}
th:first-child,td:first-child{text-align:left}
th{font-size:12.5px;color:var(--muted);font-weight:600}
.callout{border-left:3px solid var(--accent);background:var(--accent-soft);padding:14px 16px;border-radius:0 10px 10px 0;margin:18px 0}
.callout.warn{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 12%,transparent)}
.formula{font-family:ui-serif,Georgia,serif;font-size:19px;padding:6px 0}
/* lab */
.lab{display:grid;grid-template-columns:300px 1fr;gap:16px;align-items:start}
@media(max-width:900px){.lab{grid-template-columns:1fr}}
.methods{display:flex;flex-direction:column;gap:6px}
.mbtn{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:left;border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:9px;padding:9px 11px;font-size:13.5px;cursor:pointer}
.mbtn:hover{border-color:var(--accent)}
.mbtn.on{border-color:var(--accent);background:var(--accent-soft)}
.mbtn .f{font-variant-numeric:tabular-nums;font-size:12.5px;color:var(--muted)}
.tag{font-size:10.5px;font-weight:600;letter-spacing:.03em;padding:1px 6px;border-radius:5px;border:1px solid var(--border);color:var(--muted);text-transform:uppercase;white-space:nowrap}
.tag.sup{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 50%,transparent)}
.grp{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--faint);margin:10px 0 2px}
.ctl{margin-top:12px}
.ctl label{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:4px}
.ctl label b{color:var(--text);font-variant-numeric:tabular-nums;font-weight:600}
input[type=range]{width:100%;accent-color:var(--accent)}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:9px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;color:var(--muted);padding:6px 12px;font-size:13px;cursor:pointer}
.seg button.on{background:var(--accent-soft);color:var(--text);font-weight:600}
.plot{position:relative}
canvas{display:block;width:100%;border-radius:8px}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12.5px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow);border-radius:8px;padding:6px 9px;font-size:12px;display:none;white-space:nowrap;z-index:3}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
@media(max-width:600px){.metrics{grid-template-columns:1fr 1fr}}
.metric{background:var(--surface-2);border-radius:9px;padding:10px 12px}
.metric .v{font-size:22px;font-weight:650;font-variant-numeric:tabular-nums}
.metric .k{font-size:12px;color:var(--muted)}
.lift.up{color:var(--good)} .lift.dn{color:var(--muted)}
.cm{display:grid;grid-template-columns:auto 1fr 1fr;gap:4px;font-size:12.5px;font-variant-numeric:tabular-nums;margin-top:6px}
.cm div{padding:6px 8px;border-radius:6px;text-align:center;background:var(--surface-2)}
.cm .h{background:transparent;color:var(--muted)}
.desc{font-size:13.5px;color:var(--muted);margin-top:12px;line-height:1.55}
.desc b{color:var(--text)}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:10px}
.busy{font-size:12.5px;color:var(--faint)}
svg text{fill:var(--muted);font-size:11px;font-family:inherit}
svg .ax{stroke:var(--border)}
.bars .row{display:grid;grid-template-columns:minmax(150px,230px) 1fr 56px;gap:10px;align-items:center;font-size:13px;padding:3px 0}
@media(max-width:600px){.bars .row{grid-template-columns:120px 1fr 48px;font-size:12px}}
.bars .track{position:relative;height:16px;background:var(--surface-2);border-radius:4px}
.bars .fill{position:absolute;left:0;top:0;bottom:0;border-radius:4px}
.bars .bl{position:absolute;top:-3px;bottom:-3px;width:0;border-left:2px dashed var(--text);opacity:.55}
.bars .num{text-align:right;font-variant-numeric:tabular-nums}
.files .card h3{font-family:ui-monospace,Menlo,monospace;font-size:13.5px}
.files .card p{font-size:13.5px;color:var(--muted)}
.issue{font-size:13px;margin-top:8px;color:var(--warn)}
ol.take{padding-left:20px;max-width:78ch} ol.take li{margin:8px 0}
.dsCard{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:24px;border:1.5px solid var(--accent)}
.dsCard .k{font-size:12.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.dsCard b{font-size:17px}
.dsCard .n{font-size:13px;color:var(--muted);margin-top:2px;max-width:60ch}
.seg.big button{padding:9px 14px;font-size:14px}
.dia{display:inline-block;width:9px;height:9px;border:1.8px solid var(--err);transform:rotate(45deg);margin-right:7px;vertical-align:0}
.fixed{font-size:13px;margin-top:8px;color:var(--good)}
.how code{font-size:.84em}
.langSeg button{padding:5px 9px;font-size:12.5px}
.designer{display:grid;grid-template-columns:300px 1fr 290px;gap:16px;align-items:start}
@media(max-width:1100px){.designer{grid-template-columns:300px 1fr}.designer>.card:last-child{grid-column:1/-1}}
@media(max-width:760px){.designer{grid-template-columns:1fr}}
.hint{font-size:12.5px;color:var(--muted)}
.chk{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted);margin-top:14px;cursor:pointer}
.btn{border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:9px;padding:8px 13px;font-size:13.5px;cursor:pointer}
.btn:hover{border-color:var(--accent)}.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.cli{display:block;margin-top:4px;padding:8px 10px;background:var(--surface-2);border-radius:8px;white-space:pre-wrap;word-break:break-word;color:var(--text)}
table.compact td,table.compact th{padding:5px 6px;font-size:12.5px}
.seg button:disabled{opacity:.4;cursor:not-allowed}
.swnote{font-size:12.5px;color:var(--muted);background:var(--accent-soft);border-left:3px solid var(--accent);padding:8px 10px;border-radius:0 8px 8px 0;margin-bottom:14px}
table.compact tr.cur td{background:var(--accent-soft)}table.compact tr[data-m]:hover td{background:var(--surface-2)}
footer{padding:36px 0 56px;color:var(--faint);font-size:13px;border-top:1px solid var(--border)}
</style>
<body>
<nav class="top"><div class="wrap">
  <span class="brand">Overlay Lab</span>
  <a class="l" href="#problem" data-t="nav_problem"></a>
  <a class="l" href="#lab" data-t="nav_lab"></a>
  <a class="l" href="#trap" data-t="nav_trap"></a>
  <a class="l" href="#signal" data-t="nav_signal"></a>
  <a class="l" href="#distinct" data-t="nav_distinct"></a>
  <a class="l" href="#results" data-t="nav_results"></a>
  <a class="l" href="#repo" data-t="nav_repo"></a>
  <a class="l" href="#takeaways" data-t="nav_take"></a>
  <span class="sp"></span>
  <div class="seg dsSeg"><button data-ds="orig" data-t="ds_orig_short"></button><button data-ds="dist" data-t="ds_dist_short"></button><button data-ds="custom" data-t="ds_custom_short"></button></div>
  <div class="seg langSeg"><button data-lang="en">EN</button><button data-lang="ru">RU</button></div>
  <button class="themebtn" id="themeBtn" data-t="theme"></button>
</div></nav>

<header class="hero wrap">
  <div class="eyebrow" data-t="hero_eyebrow"></div>
  <h1 data-t="hero_h1"></h1>
  <p class="lede" data-t="hero_lede"></p>
  <div class="card dsCard">
    <div><div class="k" data-t="ds_viewing"></div><b id="dsHero"></b><div class="n" id="dsHeroNote"></div></div>
    <div class="seg dsSeg big"><button data-ds="orig" data-t="ds_orig_long"></button><button data-ds="dist" data-t="ds_dist_long"></button><button data-ds="custom" data-t="ds_custom_long"></button></div>
  </div>
</header>

<section id="problem"><div class="wrap">
  <h2 data-t="prob_h"></h2>
  <p class="sub"><b id="dsName"></b><br><span id="probSub"></span></p>
  <div class="grid g4">
    <div class="card tile"><div class="k" data-t="tile_points"></div><div class="v" id="tN">–</div><div class="n" data-t="tile_points_n"></div></div>
    <div class="card tile"><div class="k" data-t="tile_red"></div><div class="v" id="tR" style="color:var(--red)">–</div><div class="n" id="tRp"></div></div>
    <div class="card tile"><div class="k" data-t="tile_green"></div><div class="v" id="tG" style="color:var(--green)">–</div><div class="n" id="tGn"></div></div>
    <div class="card tile"><div class="k" data-t="tile_sep"></div><div class="v" id="tSep">–</div><div class="n" data-t="tile_sep_n"></div></div>
  </div>
  <p class="sub" style="margin:26px 0 16px" data-t="des_sub"></p>
  <div class="designer">
    <div class="card">
      <div class="swnote" id="desSwitchNote"></div>
      <h3 style="color:var(--green)" data-t="des_green"></h3>
      <div class="seg" id="gDist"><button data-v="uniform" class="on" data-t="d_uniform"></button><button data-v="gaussian" data-t="d_gauss"></button></div>
      <div class="ctl"><label><span data-t="des_n"></span> <b id="v_ng"></b></label><input type="range" id="s_ng" min="200" max="3000" step="25" value="1445"></div>
      <div class="ctl" id="ctl_gs"><label><span data-t="des_gsig"></span> <b id="v_gs"></b></label><input type="range" id="s_gs" min="100" max="900" step="10" value="400"></div>
      <h3 style="color:var(--red);margin-top:18px" data-t="des_red"></h3>
      <div class="seg" id="rDist"><button data-v="ring" class="on" data-t="d_ring"></button><button data-v="gaussian" data-t="d_gauss"></button><button data-v="uniform" data-t="d_uniform"></button></div>
      <div class="ctl"><label><span data-t="des_n"></span> <b id="v_nr"></b></label><input type="range" id="s_nr" min="20" max="800" step="1" value="227"></div>
      <div class="ctl" id="ctl_R"><label><span data-t="des_R"></span> <b id="v_R"></b></label><input type="range" id="s_R" min="40" max="700" step="5" value="350"></div>
      <div class="ctl" id="ctl_rs"><label><span id="l_rs"></span> <b id="v_rs"></b></label><input type="range" id="s_rs" min="3" max="300" step="1" value="15"></div>
      <div class="ctl" id="ctl_c"><label><span data-t="des_center"></span> <b id="v_c"></b></label><div class="hint" data-t="des_click"></div></div>
      <div class="ctl"><label><span data-t="des_seed"></span> <b id="v_seed"></b></label><input type="range" id="s_seed" min="1" max="200" value="42"></div>
      <label class="chk" id="clipLbl"><input type="checkbox" id="clipRed"> <span data-t="des_clip"></span></label>
      <div class="hint" style="margin:4px 0 0 24px" data-t="des_clip_h"></div>
      <label class="chk"><input type="checkbox" id="autoRun" checked> <span data-t="des_auto"></span></label>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px"><button class="btn primary" id="desRun" data-t="des_run"></button><button class="btn" id="desReset" data-t="des_reset"></button></div>
    </div>
    <div class="card">
      <div class="toolbar" style="margin-bottom:6px"><b style="font-size:14px" data-t="des_map"></b><span class="busy" id="desBusy"></span></div>
      <div class="seg" id="mapSeg" style="margin-bottom:8px"><button data-v="truth" class="on" data-t="mini_truth"></button><button data-v="blind" data-t="mini_blind"></button></div>
      <div class="plot"><canvas id="desCanvas" style="cursor:crosshair"></canvas></div>
      <div class="legend" id="desLegend"></div>
      <div class="hint" style="margin-top:10px"><span data-t="des_cli"></span><br><code id="desCli" class="cli"></code></div>
    </div>
    <div class="card">
      <h3 id="desResH"></h3>
      <div class="hint" data-t="des_res_hint" style="margin-bottom:6px"></div>
      <table id="desTable" class="compact"></table>
      <button class="btn" id="desOpen" style="margin-top:12px" data-t="des_open"></button>
    </div>
  </div>

  <div class="card" style="margin-top:16px">
    <h3 data-t="stats_h"></h3>
    <table id="classStats"></table>
    <p class="desc" id="statNote"></p>
  </div>
</div></section>

<section id="lab"><div class="wrap">
  <h2 data-t="lab_h"></h2>
  <p class="sub" data-t="lab_sub"></p>
  <div class="lab">
    <div class="card">
      <div class="methods" id="methods"></div>
      <div id="controls"></div>
    </div>
    <div class="card">
      <div class="toolbar">
        <div style="display:flex;gap:8px;flex-wrap:wrap"><div class="seg" id="viewSeg">
          <button data-v="outcome" class="on" data-t="view_outcome"></button><button data-v="truth" data-t="view_truth"></button><button data-v="score" data-t="view_score"></button>
        </div><div class="seg" id="spaceSeg"><button data-s="xy" class="on">X–Y</button><button data-s="tsne" data-t="space_tsne" id="tsneBtn"></button></div></div>
        <span class="busy" id="busy"></span>
      </div>
      <div class="plot" id="plotWrap"><canvas id="canvas"></canvas><div class="tip" id="tip"></div></div>
      <div class="legend" id="legend"></div>
      <div class="metrics">
        <div class="metric"><div class="k" data-t="m_f1"></div><div class="v" id="mF1">–</div></div>
        <div class="metric"><div class="k" data-t="m_prec"></div><div class="v" id="mP">–</div></div>
        <div class="metric"><div class="k" data-t="m_rec"></div><div class="v" id="mR">–</div></div>
        <div class="metric"><div class="k" data-t="m_lift"></div><div class="v lift" id="mLift">–</div></div>
      </div>
      <div class="grid g2" style="margin-top:14px;gap:14px">
        <div>
          <h3 style="font-size:13px;color:var(--muted)" data-t="cm_h"></h3>
          <div class="cm" id="cm"></div>
        </div>
        <div id="curveBox">
          <h3 style="font-size:13px;color:var(--muted)" data-t="curve_h"></h3>
          <svg id="curveSvg" viewBox="0 0 360 170" width="100%" style="cursor:ew-resize;touch-action:none"></svg>
        </div>
      </div>
      <div class="desc" id="mDesc"></div>
    </div>
  </div>
</div></section>

<section id="trap"><div class="wrap">
  <h2 data-t="trap_h"></h2>
  <p class="sub" id="trapSub"></p>
  <div class="grid g2">
    <div class="card">
      <div class="formula">F1<sub>all red</sub> = 2p / (1 + p) = <b id="bF1">0.2391</b></div>
      <p class="desc" data-t="trap_desc"></p>
      <div class="ctl"><label><span data-t="trap_slider"></span> <b id="qLbl">100%</b></label><input type="range" id="qSl" min="1" max="100" value="100"></div>
      <div class="metrics" style="grid-template-columns:repeat(3,1fr)">
        <div class="metric"><div class="k" data-t="m_prec"></div><div class="v" id="qP">–</div></div>
        <div class="metric"><div class="k" data-t="m_rec"></div><div class="v" id="qR">–</div></div>
        <div class="metric"><div class="k" data-t="trap_expF1"></div><div class="v" id="qF">–</div></div>
      </div>
    </div>
    <div class="card">
      <h3 data-t="trap_chart_h"></h3>
      <svg id="trapSvg" viewBox="0 0 460 250" width="100%"></svg>
      <p class="desc" data-t="trap_chart_desc"></p>
    </div>
  </div>
</div></section>

<section id="signal"><div class="wrap">
  <h2 data-t="sig_h"></h2>
  <p class="sub" id="sigSub"></p>
  <div class="grid g2">
    <div class="card">
      <h3 data-t="hist_h"></h3>
      <div class="ctl" style="margin-top:0"><label>k <b id="kSigLbl">10</b></label><input type="range" id="kSig" min="1" max="40" value="10"></div>
      <svg id="histSvg" viewBox="0 0 460 230" width="100%"></svg>
      <div class="legend"><span><i style="background:var(--red)"></i><span data-t="red"></span></span><span><i style="background:var(--green)"></i><span data-t="green"></span></span><span id="histNote"></span></div>
      <p class="desc" id="sigNote"></p>
    </div>
    <div class="card">
      <h3 data-t="hom_h"></h3>
      <svg id="homSvg" viewBox="0 0 460 230" width="100%"></svg>
      <p class="desc" id="homNote"></p>
    </div>
  </div>
  <div class="callout" id="sigCallout"></div>
</div></section>

<section id="distinct"><div class="wrap">
  <h2 data-t="dist_h"></h2>
  <p class="sub" data-t="dist_sub"></p>
  <div class="grid g2">

take_list:"<li><b>Always report the trivial baseline.</b> On the original data “everything is red” scores F1 = 0.239, and about half of the notebook's results are within ±0.02 of it.</li><li><b>Global-blob methods can't work when classes share one distribution.</b> K-Means, GMM, FCM, spectral and agglomerative clustering split the plane geometrically, not by colour.</li><li><b>Original data: local sparsity is the signal.</b> The raw k-NN distance (F1 0.39–0.46) beats LOF and LNND, because their normalisation removes the signal.</li><li><b>Distinct data: model the shape.</b> With a ring on a uniform background, k-NN density gets ≈ 0.62 and the matching ring + uniform EM gets close to the Bayes ceiling (≈ 0.8). The README's 2-component GMM still fails, because it's the wrong model.</li><li><b>t-SNE is for looking, not classifying.</b> It keeps the ring connected but flattens the density difference, and the red cluster can only be picked with labels.</li><li><b>Watch for label leakage.</b> Cluster-to-colour mapping, LNND's k, DBSCAN's eps and the quickstart threshold were all chosen by F1 against the true labels.</li><li><b>Compare with the PR curve, not one F1.</b> For a rare class, F1 vs. fraction flagged (as in the lab) shows whether a score really ranks reds first.</li>",

md_km:"K-Means делит плоскость одной прямой между двумя центроидами. Центр у классов общий (на различимых данных кольцо стоит в центре облака), поэтому разрез чисто геометрический, и в каждой половине примерно одинаковая доля красных. Соответствие «кластер → цвет» выбирается по меткам, как в ноутбуке.",
md_gmm:"Главная рекомендация README. EM подгоняет две гауссианы с полной ковариацией. Ни исходное облако, ни кольцо не являются «двумя облаками», поэтому модель находит две половины пространства. Эллипсы — 1σ и 2σ. Кривая F1 остаётся около случайной линии.",
md_ring:"EM для смеси <b>зашумлённой окружности и равномерного фона</b> на области данных — та же модель, по которой создан различимый датасет. Метки не используются. Грубый перебор по сетке выбирает начальную точку, затем на каждом шаге окружность переподгоняется взвешенным МНК (метод Касы) и обновляются R, σ и доля красных. Нарисованы найденная окружность и полоса ±2σ. На исходных данных кольца нет, и модель цепляется за шум.",
md_fcm:"Мягкий K-Means, перенесённый из NumPy-версии ноутбука. Степени принадлежности — гладкие функции расстояния до двух центров, поэтому проблема та же: центры не зависят от цвета.",
md_db:"Точки вне самого большого связного по плотности кластера считаются красными. На исходных данных при маленьком eps всё становится шумом (= все красные = 0,239, «лучшая» настройка ноутбука). На различимых данных кольцо плотнее, но DBSCAN считает выбросом разреженный фон, поэтому это правило редко выделяет кольцо.",
md_kdd:"Оценка = минус расстояние до k-го ближайшего соседа, то есть <b>плотные места считаются красными</b>. Это правильное направление для различимых данных: кольцо примерно в 3,7 раза плотнее фона (F1 ≈ 0,62 без меток). На исходных данных оценка бесполезна, потому что там красный — <i>разреженный</i> класс.",
md_kd:"Оценка = расстояние до k-го ближайшего соседа, без меток и без нормировки. На <i>исходных</i> данных красные точки находятся в более пустых местах, поэтому среди 13,6% самых разреженных точек красных гораздо больше: F1 0,39 при k = 10 и 0,46 при k = 5 — выше, чем у SVM с учителем из ноутбука (0,41). На различимых данных направление обратное, там используйте плотность k-NN.",
md_lnnd:"<b>Local Nearest-Neighbour Distance</b> — лучший метод без меток в исходном ноутбуке (F1 0,295 при k = 10). Оценка = d<sub>k</sub>(p), делённое на среднее d<sub>k</sub> соседей p: велика, когда точка разреженнее окружения. Нормировка по соседям убирает большую часть сигнала глобальной плотности.",
md_lof:"LOF (Breunig и др.) — классическая версия идеи LNND с расстоянием достижимости и локальной плотностью достижимости. В overlay_advanced_tuning.py используется как вес для GMM.",
md_tsne:"Конвейер t-SNE из ноутбука как классификатор. t-SNE отображает точки на плоскость (для исходного и различимого датасетов при perplexity 30 карта посчитана заранее в scikit-learn, в остальных случаях — прямо в браузере тем же алгоритмом), DBSCAN кластеризует карту, и красным объявляется кластер с лучшим F1. <b>Выбор этого кластера использует метки.</b> Переключите пространство на «Карта t-SNE», чтобы увидеть вложение. t-SNE сохраняет локальные окрестности, но выравнивает плотность, поэтому плотная красная фигура не выделяется как плотный кластер.",md_tsnek:"Классификатор t-SNE без меток: строим карту t-SNE, оцениваем каждую точку по плотности её окрестности <i>на карте</i> (минус расстояние до k-го соседа там) и отмечаем самые плотные. Сравните с «Плотность k-NN» на исходных X–Y: калибровка perplexity в t-SNE выравнивает плотность, поэтому большая часть сигнала теряется (различимые данные: 0,31 против 0,62).",
md_sup:"<b>Использует метки.</b> Оценка = доля красных среди k ближайших соседей, без самой точки. Показывает, как далеко заходит локальный сигнал, когда цвет известен.",
sig_h:"Где на самом деле сигнал",

sig_sub_dist:"<b>Различимый датасет:</b> красные точки лежат на окружности, которая в несколько раз плотнее равномерного фона, поэтому их соседи ближе и в основном красные.",

sig_call_orig:"<b>Исходный датасет: побеждает простейшая оценка.</b> Упорядочим точки по расстоянию до k-го ближайшего соседа и отметим 227 самых разреженных. Метки не используются, а F1 равен <b>0,39 при k = 10</b> и <b>0,46 при k = 5</b>. Это не хуже RBF-SVM с учителем из ноутбука (F1 на тесте 0,41) и намного лучше LNND (0,295). Попробуйте «Разреженность k-NN» в лаборатории.",
sig_call_dist:"<b>Различимый датасет: моделируйте форму.</b> Плотность k-NN использует только «красные плотнее» и без меток даёт F1 ≈ 0,62. EM «кольцо + фон» использует ещё и «красные лежат на окружности», поэтому восстанавливает окружность (центр, R, σ) и приближается к байесовскому потолку (≈ 0,8). Попробуйте оба метода в лаборатории.",
dist_h:"Датасет с различимыми распределениями",
dist_sub:"Свой вариант можно собрать в <a href=\"#problem\">конструкторе</a>. <code>make_distinct_dataset.py</code> создаёт <code>df_red_green_distinct.csv</code>. Он сохраняет исходную область и меняет только то, как размещаются цвета: <b style=\"color:var(--green)\">зелёные</b> распределены равномерно, а <b style=\"color:var(--red)\">красные</b> — вдоль окружности с гауссовым профилем поперёк неё. Классы всё ещё перекрываются, потому что зелёные покрывают и кольцо, поэтому даже истинная модель не достигает F1 = 1.",
how_h:"Как создан датасет",
how_body:"<ol class=\"take\" style=\"font-size:14px\"><li><b>Область F.</b> Все места в пределах 45 px от какой-либо точки исходного CSV. Так сохраняется общее расположение, включая «дыры».</li><li><b style=\"color:var(--green)\">Зелёные: равномерно (пуассоновский процесс).</b> Число точек N<sub>g</sub> ~ Poisson(1445) (получилось 1 477). Каждая точка x ~ Uniform(F), поэтому плотность постоянна: <code>p<sub>g</sub>(x) = 1 / |F|</code>, |F| ≈ 1,92 млн px².</li><li><b style=\"color:var(--red)\">Красные: зашумлённая окружность.</b> 227 точек, угол θ ~ Uniform(0, 2π) и радиус r ~ Normal(R = 350, σ = 15) px; точка ставится в x = c + r·(cos θ, sin θ), центр c = (1046, 904). Красные <b>не</b> ограничены областью F: точки кольца, попавшие вне зелёной области, там и остаются (здесь 17 из 227). Внутри F удерживаются только зелёные. Плотность: <code>p<sub>r</sub>(x) = N(|x − c|; R, σ²) / (2π|x − c|)</code>.</li><li><b>Оптимальное правило.</b> P(красный | x) = π<sub>r</sub>p<sub>r</sub> / (π<sub>r</sub>p<sub>r</sub> + π<sub>g</sub>p<sub>g</sub>). На кольце внутри F это около 0,79 (3,7 красных на одного зелёного); вне F зелёных нет совсем, поэтому 1; в нескольких σ от кольца — почти 0. Зерно 42, поэтому файл воспроизводим.</li></ol>",

tsne_body:"<p class=\"desc\" style=\"margin-top:0\"><b>Только частично.</b> t-SNE сохраняет локальные окрестности, поэтому кольцо остаётся связной полосой (переключите лабораторию на «Карта t-SNE»). Но для разделения он подходит плохо:</p><ol class=\"take\" style=\"font-size:13.5px;color:var(--muted)\"><li><b>t-SNE выравнивает плотность.</b> Perplexity даёт каждой точке примерно одинаковое число эффективных соседей, а именно плотность отличает кольцо от фона. Плотность k-NN, посчитанная <i>на карте t-SNE</i>, даёт F1 0,31 против 0,62 для той же оценки на исходных X–Y.</li><li><b>Для выбора красного кластера нужны метки.</b> DBSCAN возвращает много кластеров, и только метки говорят, какой из них — кольцо.</li><li><b>Результат неустойчив.</b> Даже при выборе кластера по меткам лучшая настройка (eps = 2,75, min_samples = 10) даёт лишь F1 ≈ 0,39, остальные — 0,33–0,37.</li></ol><p class=\"desc\">t-SNE хорош, чтобы <i>увидеть</i> структуру. Для <i>классификации</i> лучше моделировать её напрямую: EM «кольцо + фон» находит окружность без меток.</p>",

function bayesTrue(P){const ar=buildDataset("orig").AREA_PX,pr=P.nr/(P.nr+P.ng),pg=1-pr,o=new Float64Array(N),SQ=Math.sqrt(2*Math.PI);
  const dg=(x,y)=>P.green==="uniform"?1/ar:Math.exp(-((x-FCEN[0])**2+(y-FCEN[1])**2)/(2*P.gs*P.gs))/(2*Math.PI*P.gs*P.gs);

  let mu=[ZX[s0],ZY[s0]],S=[[.05,0],[0,.05]],pi=.15;const r=new Float64Array(N),u=1/AREA;
  for(let it=0;it<300;it++){const a=S[0][0],b=S[0][1],d=S[1][1],det=a*d-b*b;let nk=0,ax=0,ay=0;

const TRUE_P={green:"uniform",ng:1445,gs:400,red:"ring",nr:227,R:350,rs:15,cx:1046,cy:904,clip:false};

function tsneWorker(){

  // sparse input affinities on 3·perplexity nearest neighbours, PCA init (std 1e-4),
  // early exaggeration 12 for 250 iterations, momentum 0.5 → 0.8, adaptive gains,
  // learning rate max(n / 12 / 4, 50). Repulsion is computed exactly (O(n²) per iteration).
  self.onmessage=function(e){
    const {X,Y,perp,iters,seed}=e.data,n=X.length,K=Math.min(n-1,Math.floor(3*perp));
    // --- 1. k nearest neighbours (squared distances) ---
    const nbI=new Int32Array(n*K),nbD=new Float64Array(n*K),bd=new Float64Array(K),bi=new Int32Array(K);
    for(let i=0;i<n;i++){bd.fill(Infinity);bi.fill(-1);
      for(let j=0;j<n;j++){if(j===i)continue;const dx=X[i]-X[j],dy=Y[i]-Y[j],v=dx*dx+dy*dy;
        if(v<bd[K-1]){let p=K-1;while(p>0&&bd[p-1]>v){bd[p]=bd[p-1];bi[p]=bi[p-1];p--}bd[p]=v;bi[p]=j}}

    const yx=new Float64Array(n),yy=new Float64Array(n);for(let i=0;i<n;i++){const a=X[i]-mx,b=Y[i]-my;yx[i]=a*c+b*s_;yy[i]=-a*s_+b*c}

function embOf(D,perp){D.emb=D.emb||{};D.embP=D.embP||{};D.embLive=D.embLive||{};

  D.embP[perp]=new Promise(res=>{
    const onMsg=m=>{if(m.done){D.emb[perp]={x:m.x,y:m.y,src:"js"};delete D.embLive[perp];onEmbDone(D);res()}else{D.embLive[perp]={x:m.x,y:m.y,it:m.it};onEmbProgress(D,perp)}};

function setupCanvas(cv,aspect){const w=cv.parentElement.clientWidth,h=Math.round(w*aspect),dpr=window.devicePixelRatio||1;cv.width=w*dpr;cv.height=h*dpr;cv.style.height=h+"px";const ctx=cv.getContext("2d");ctx.setTransform(dpr,0,0,dpr,0,0);return{ctx,w,h}}
function mapper(w,h,pad=14){const sc=Math.min((w-2*pad)/(xmax-xmin),(h-2*pad)/(ymax-ymin)),ox=(w-sc*(xmax-xmin))/2,oy=(h-sc*(ymax-ymin))/2;return{px:x=>ox+(x-xmin)*sc,py:y=>h-oy-(y-ymin)*sc,sc}}
function mapperE(w,h,pad=14){const sc=Math.min((w-2*pad)/(exmax-exmin),(h-2*pad)/(eymax-eymin)),ox=(w-sc*(exmax-exmin))/2,oy=(h-sc*(eymax-eymin))/2;return{px:x=>ox+(x-exmin)*sc,py:y=>h-oy-(y-eymin)*sc,sc}}
function mark(ctx,x,y,isRed,col,r){ctx.strokeStyle=col;ctx.fillStyle=col;if(isRed){ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill()}else{ctx.lineWidth=1.3;ctx.beginPath();ctx.moveTo(x-r,y-r);ctx.lineTo(x+r,y+r);ctx.moveTo(x+r,y-r);ctx.lineTo(x-r,y+r);ctx.stroke()}}
function diamond(ctx,x,y,s,col){ctx.strokeStyle=col;ctx.lineWidth=1.7;ctx.beginPath();ctx.moveTo(x,y-s);ctx.lineTo(x+s,y);ctx.lineTo(x,y+s);ctx.lineTo(x-s,y);ctx.closePath();ctx.stroke()}
let geo=null;
function mapperArr(w,h,X,Yv,pad=14){let a=Infinity,b=-Infinity,c=Infinity,d=-Infinity;for(let i=0;i<X.length;i++){if(X[i]<a)a=X[i];if(X[i]>b)b=X[i];if(Yv[i]<c)c=Yv[i];if(Yv[i]>d)d=Yv[i]}
  const sc=Math.min((w-2*pad)/((b-a)||1),(h-2*pad)/((d-c)||1)),ox=(w-sc*(b-a))/2,oy=(h-sc*(d-c))/2;return{px:x=>ox+(x-a)*sc,py:y=>h-oy-(y-c)*sc,sc}}
function drawScatter(){const cv=document.getElementById("canvas"),{ctx,w,h}=setupCanvas(cv,0.86),TS=state.space==="tsne";let E=null;
  if(TS){const D=buildDataset(DS),pp=curPerp();E=embOf(D,pp)||(D.embLive&&D.embLive[pp])||null;if(!E)getEmb(pp)}
  ctx.fillStyle=css("--surface-2");ctx.fillRect(0,0,w,h);
  if(TS&&!E){ctx.fillStyle=css("--muted");ctx.font="14px system-ui,sans-serif";ctx.textAlign="center";ctx.fillText(T("tsne_calc"),w/2,h/2);geo=null;document.getElementById("legend").innerHTML="";return}
  const M=TS?mapperArr(w,h,E.x,E.y):mapper(w,h),AX=TS?E.x:RX,AY=TS?E.y:RY;geo={M,w,h,AX,AY};
  const r=state.res,pred=predOf(r),v=r.pending?"truth":state.view,rr=Math.max(2,Math.min(3.4,w/240));
  const C={tp:css("--tp"),tn:css("--tn"),red:css("--red"),green:css("--green"),err:css("--err")};
  let smin=0,smax=1;if(r.score){const o=r.curve.order;smax=r.score[o[0]];smin=r.score[o[N-1]]}
  const wrong=i=>pred[i]!==Y[i];
  const order=[];for(let i=0;i<N;i++)order.push(i);order.sort((a,b)=>(wrong(a)*4+Y[a])-(wrong(b)*4+Y[b]));
  for(const i of order){const x=M.px(AX[i]),y=M.py(AY[i]);let col,alpha=.95;
    if(v==="truth")col=Y[i]?C.red:C.green;

      const zx=mu[0]+ex*Math.cos(ang)-ey*Math.sin(ang),zy=mu[1]+ex*Math.sin(ang)+ey*Math.cos(ang);const[p,q]=toPx(zx,zy);t?ctx.lineTo(p,q):ctx.moveTo(p,q)}
      ctx.strokeStyle=k===r.redComp?C.red:css("--text");ctx.globalAlpha=s===1?.85:.4;ctx.lineWidth=2;ctx.setLineDash(s===2?[5,4]:[]);ctx.stroke()})});ctx.setLineDash([]);ctx.globalAlpha=1}

    [[g.R,[],.9,2],[g.R-2*g.s,[4,4],.45,1.3],[g.R+2*g.s,[4,4],.45,1.3]].forEach(([rad,dash,al,lw])=>{if(rad<=0)return;ctx.beginPath();ctx.arc(px,py,rad*M.sc,0,2*Math.PI);ctx.strokeStyle=css("--text");ctx.setLineDash(dash);ctx.globalAlpha=al;ctx.lineWidth=lw;ctx.stroke()});

  if(r.blob&&!TS){const g=r.blob;[[g.s,[],.85],[2*g.s,[5,4],.45]].forEach(([rad,dash,al])=>{ctx.beginPath();ctx.arc(M.px(g.cx),M.py(g.cy),rad*M.sc,0,2*Math.PI);ctx.strokeStyle=css("--text");ctx.setLineDash(dash);ctx.globalAlpha=al;ctx.lineWidth=1.6;ctx.stroke()});ctx.setLineDash([]);ctx.globalAlpha=1}
  if(r.centers&&!TS){r.centers.forEach(c=>{const[p,q]=toPx(c[0],c[1]);ctx.fillStyle=css("--text");ctx.strokeStyle=css("--surface");ctx.lineWidth=3;ctx.beginPath();ctx.arc(p,q,7,0,7);ctx.stroke();ctx.fill()})}
  const lg=document.getElementById("legend");
  if(v==="truth")lg.innerHTML=`<span><i style="background:var(--red)"></i>${T("lg_truth_r")}</span><span><i style="background:var(--green)"></i>${T("lg_truth_g")}</span>`;
  else if(v==="score"&&r.score)lg.innerHTML=`<span><i style="background:hsl(220 80% 45%)"></i>${T("lg_lo")}</span><span><i style="background:hsl(20 80% 55%)"></i>${T("lg_hi")}</span>`;
  else lg.innerHTML=`<span><i style="background:var(--tp)"></i>${T("lg_tp")}</span><span><i style="background:var(--tn)"></i>${T("lg_tn")}</span><span><span class="dia"></span>${T("lg_err")}</span><span>${T("lg_shapes")}</span>${r.ring&&!TS?`<span>◯ ${T("lg_ring")}</span>`:""}`;
}
(function(){const cv=document.getElementById("canvas"),tip=document.getElementById("tip");

function svgEl(t,a){const e=document.createElementNS("http://www.w3.org/2000/svg",t);for(const k in a)e.setAttribute(k,a[k]);return e}
function lineChart(svg,W,H,pad,series,opts){svg.innerHTML="";const[L,R,T_,B]=pad,xm=opts.xmax||1,ym=opts.ymax,x0=opts.xmin||0;
  const X=v=>L+(W-L-R)*(v-x0)/(xm-x0),Yp=v=>H-B-(H-T_-B)*v/ym;
  for(let g=0;g<=4;g++){const v=ym*g/4;svg.appendChild(svgEl("line",{x1:L,x2:W-R,y1:Yp(v),y2:Yp(v),class:"ax","stroke-width":1}));const t=svgEl("text",{x:L-6,y:Yp(v)+4,"text-anchor":"end"});t.textContent=opts.yfmt?opts.yfmt(v):num(v,2);svg.appendChild(t)}
  for(let g=0;g<=4;g++){const v=x0+(xm-x0)*g/4,t=svgEl("text",{x:X(v),y:H-B+15,"text-anchor":"middle"});t.textContent=opts.xfmt?opts.xfmt(v):v;svg.appendChild(t)}
  if(opts.xlabel){const t=svgEl("text",{x:(L+W-R)/2,y:H-2,"text-anchor":"middle"});t.textContent=opts.xlabel;svg.appendChild(t)}
  series.forEach(s=>{let d="";s.pts.forEach(([x,y],i)=>d+=(i?"L":"M")+X(x).toFixed(1)+","+Yp(y).toFixed(1));svg.appendChild(svgEl("path",{d,fill:s.fill||"none",stroke:s.color,"stroke-width":s.w||2,"stroke-dasharray":s.dash||"",opacity:s.op||1}))});

function drawCurve(){const box=document.getElementById("curveBox"),r=state.res;box.style.display=r.curve?"":"none";if(!r.curve)return;
  const svg=document.getElementById("curveSvg"),f=r.curve.f,pts=[],rp=[];for(let n=1;n<=N;n+=3){pts.push([n/N,f[n]]);rp.push([n/N,randF1(n/N)])}

  const sel=(a,c)=>Array.from(a).filter((_,i)=>Y[i]===c);const rows=[["st_mx",mean,RX],["st_sx",std,RX],["st_my",mean,RY],["st_sy",std,RY]];

const median=a=>{const s=a.slice().sort((x,y)=>x-y);return s[Math.floor(s.length/2)]};
function signal(){const k=+document.getElementById("kSig").value;document.getElementById("kSigLbl").textContent=k;
  document.getElementById("sigSub").innerHTML=T("sig_sub_"+DS);document.getElementById("sigCallout").innerHTML=T("sig_call_"+DS);
  const r=[],g=[];for(let i=0;i<N;i++)(Y[i]?r:g).push(dk(i,k));
  const all=r.concat(g).sort((a,b)=>a-b),hi=all[Math.floor(N*.99)],B=28,bw=hi/B;
  const hr=new Array(B).fill(0),hg=new Array(B).fill(0);r.forEach(v=>hr[Math.min(B-1,Math.floor(v/bw))]++);g.forEach(v=>hg[Math.min(B-1,Math.floor(v/bw))]++);
  const nr=hr.map(v=>v/r.length),ng=hg.map(v=>v/g.length),ym=Math.max(...nr,...ng)*1.1;
  const svg=document.getElementById("histSvg"),toPts=a=>{const p=[];a.forEach((v,i)=>{p.push([i*bw,v]);p.push([(i+1)*bw,v])});return p};
  lineChart(svg,460,230,[38,10,10,34],[{pts:toPts(ng),color:css("--green"),w:2.2},{pts:toPts(nr),color:css("--red"),w:2.2}],{xmax:hi,ymax:ym,xfmt:v=>num(v,2),xlabel:T("hist_x",{k})});
  document.getElementById("histNote").textContent=T("hist_note",{r:num(median(r),3),g:num(median(g),3),x:num(median(r)/median(g),2)});

      desB(T("des_cls",{i:i+1,n:list.length}));const m=list[i++];const cur=DS;useDataset("custom");const v=defaultF1(m.id);
      if(!isFinite(v)&&(m.id==="tsne"||m.id==="tsnek")){const P=startEmb(buildDataset("custom"),30);useDataset(cur);desB(T("des_tsne"));i--;P.then(()=>{if(tok===desTok)setTimeout(step,0)});return}
      DES[m.id]=v;useDataset(cur);renderDesTable();setTimeout(step,0)};
    setTimeout(step,0)},20)}
function desChanged(now){desUI();makeCustom();desStale=true;drawDes();renderDesTable();clearTimeout(desTimer);if($("autoRun").checked)desTimer=setTimeout(()=>desRun(true,true),now?0:300)}
[["s_ng","ng"],["s_gs","gs"],["s_nr","nr"],["s_R","R"],["s_rs","rs"],["s_seed","seed"]].forEach(([id,k])=>$(id).oninput=e=>{CP[k]=+e.target.value;desChanged()});
document.querySelectorAll("#gDist button").forEach(b=>b.onclick=()=>{CP.green=b.dataset.v;desChanged()});
$("clipRed").onchange=e=>{CP.clip=e.target.checked;desChanged()};
document.querySelectorAll("#rDist button").forEach(b=>b.onclick=()=>{CP.red=b.dataset.v;if(CP.red==="gaussian"&&CP.rs<40)CP.rs=120;if(CP.red==="ring"&&CP.rs>80)CP.rs=15;desChanged()});
$("desCanvas").addEventListener("click",e=>{if(!desM||CP.red==="uniform")return;const b=$("desCanvas").getBoundingClientRect(),[x,y]=desM.inv(e.clientX-b.left,e.clientY-b.top);
  CP.cx=Math.round(Math.min(FHI[0],Math.max(FLO[0],x)));CP.cy=Math.round(Math.min(FHI[1],Math.max(FLO[1],y)));desChanged(true)});
$("desRun").onclick=()=>desRun(false,true);$("desReset").onclick=()=>{CP={...DEF_P};desChanged()};$("desOpen").onclick=()=>openCustom();

/* ======================= init ======================= */
state.m=defaultMethod(DS);
if(!DATASETS.custom)makeCustom();
applyLang();desUI();syncDs();problem();results("score");renderMethods();renderControls();redraw();
setTimeout(()=>{METHODS.forEach(m=>{if(!m.only||m.only.includes(DS))runMethod(m.id)});renderMethods();setTimeout(()=>{compareTable();desRun(true,DS==="custom")},30)},50);
</script>
